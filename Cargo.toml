[workspace]

[package]
name = "ascom-alpaca-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Framework-agnostic ASCOM Alpaca protocol types and traits for Rust — all 10 device types, no HTTP framework required"
license = "MPL-2.0"
repository = "https://github.com/nightwatch-astro/ascom-alpaca-core"
documentation = "https://docs.rs/ascom-alpaca-core"
keywords = ["ascom", "alpaca", "astronomy", "astrophotography", "telescope"]
categories = ["science", "encoding"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "2"
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
serde_yaml = "0.9"
insta = { version = "1", features = ["json"] }

[features]
default = ["all-devices"]
all-devices = [
    "camera",
    "cover_calibrator",
    "dome",
    "filter_wheel",
    "focuser",
    "observing_conditions",
    "rotator",
    "safety_monitor",
    "switch",
    "telescope",
]
camera = []
cover_calibrator = []
dome = []
filter_wheel = []
focuser = []
observing_conditions = []
rotator = []
safety_monitor = []
switch = []
telescope = []
conformu = ["dep:tiny_http", "all-devices"]

[[example]]
name = "conformu_harness"
required-features = ["conformu"]

[lints.clippy]
# Lint groups (set lower priority so individual overrides win)
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction lints and missing_docs are declared in src/lib.rs instead: a
# [lints] table applies to every target in the package, including the
# integration-test crates, where panicking assertions and undocumented test
# crates are correct.

# Pedantic opt-outs (inappropriate for this crate)
module_name_repetitions = "allow"       # DeviceType in types module is fine
must_use_candidate = "allow"            # Too noisy for builder/response APIs
missing_errors_doc = "allow"            # Trait defaults all return NotImplemented
missing_panics_doc = "allow"            # Covered by unwrap_used lint
return_self_not_must_use = "allow"      # Builder pattern with_transaction()
