# clippy.toml — threshold tuning for ascom-alpaca-core

# Dispatch functions are inherently large match blocks mapping ~60 methods.
# Allow higher cognitive complexity for these.
cognitive-complexity-threshold = 40

# The device traits have many methods (Camera ~55, Telescope ~60).
# Raise the too-many-lines threshold accordingly.
too-many-lines-threshold = 200

# Dispatch functions have many parameters by design (registry, num, method, params, is_put, ctx, stx).
too-many-arguments-threshold = 8

# The crate does not use MSRV-gated suggestions — stabilized features only.
msrv = "1.75"

# Restriction lints (unwrap_used, expect_used) target library code. Test
# assertions panic on failure by design.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
